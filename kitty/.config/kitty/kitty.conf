# vim:fileencoding=utf-8:foldmethod=marker

# -----------------------------------------------------------------------------
# TEMA ENTEGRASYONU (Ghostty: TokyoNight)
# -----------------------------------------------------------------------------
include Tokyo Night.conf

# -----------------------------------------------------------------------------
# FONT AYARLARI
# -----------------------------------------------------------------------------
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
disable_ligatures never

# -----------------------------------------------------------------------------
# İMLEÇ (CURSOR) & İZ ANİMASYONU (GHOSTTY SHADER KARŞILIĞI)
# -----------------------------------------------------------------------------
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0
cursor_stop_blinking_after 0

# Ghostty cursor shader'ı gibi akıcı imleç takip efekti
cursor_trail 1
cursor_trail_decay 0.01 0.5
cursor_trail_start_threshold 0

# -----------------------------------------------------------------------------
# KAYDIRMA (SCROLLBACK) VE FARE (MOUSE)
# -----------------------------------------------------------------------------
scrollback_lines 10000
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 5.0
mouse_hide_wait 3.0

# Ghostty: copy-on-select = clipboard
copy_on_select clipboard
strip_trailing_spaces smart

# Ghostty: clipboard-read/write allow, paste protection
clipboard_control write-clipboard write-primary read-clipboard read-primary
paste_actions quote-urls-at-prompt

# -----------------------------------------------------------------------------
# PERFORMANS & RENDER
# -----------------------------------------------------------------------------
repaint_delay 10
input_delay 3
sync_to_monitor yes

# -----------------------------------------------------------------------------
# SAYDAMLIK VE GÖRSEL EFEKTLER (GHOSTTY: background-opacity = 0.9)
# -----------------------------------------------------------------------------
background_opacity 0.90
dynamic_background_opacity yes
# Ghostty'de blur olmadığı için net saydamlık sağlar (KDE Plasma 6'da blur opaklaşmaya yol açabilir)
background_blur 0

# -----------------------------------------------------------------------------
# ZİL (BELL) VE BİLDİRİMLER (GHOSTTY: notify-on-command-finish)
# -----------------------------------------------------------------------------
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes

# 20 saniyeden uzun süren komutlar tamamlandığında bildirim gönder
notify_on_cmd_finish unfocused 20.0 notify

# -----------------------------------------------------------------------------
# PENCERE DÜZENİ VE WAYLAND ENTEGRASYONU
# -----------------------------------------------------------------------------
remember_window_size  yes
initial_window_width  1024
initial_window_height 768
window_padding_width 0
window_margin_width 0
placement_strategy center
resize_in_steps yes
hide_window_decorations yes

# Ghostty: confirm-close-surface = false
confirm_os_window_close 0

linux_display_server wayland

# -----------------------------------------------------------------------------
# KABUK ENTEGRASYONU & UZAKTAN KONTROL
# -----------------------------------------------------------------------------
shell_integration enabled
allow_remote_control yes

# -----------------------------------------------------------------------------
# KLAVYE KISAYOLLARI
# -----------------------------------------------------------------------------
clear_all_shortcuts no
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+plus change_font_size all +2.0
map ctrl+shift+minus change_font_size all -2.0
map ctrl+shift+backspace change_font_size all 0
