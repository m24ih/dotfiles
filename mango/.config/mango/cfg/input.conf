# | Input Devices |
# Configure your input devices here. | https://mangowm.github.io/docs/configuration/input

# Keyboard settings
xkb_rules_layout = us,tr
xkb_rules_options = grp:alt_shift_toggle
numlockon = 1
repeat_rate = 40
repeat_delay = 250

# Mouse settings
# If you want to disable pointer acceleration, uncomment the lines below.
mouse_accel_profile = 1
mouse_accel_speed = -0.6

# Touchpad / Trackpad settings
trackpad_natural_scrolling = 1
tap_to_click = 1
tap_and_drag = 1
disable_while_typing = 1

# Click method: 1 = Button areas (corners/sections), 2 = Clickfinger (1 finger left, 2 fingers right, 3 fingers middle)
click_method = 2

# Scroll method: 1 = Two-finger, 2 = Edge, 4 = Button
scroll_method = 1

# Scroll speed / factor (range: 0.1 - 10.0, default: 1.0)
trackpad_scroll_factor = 1.0

# Trackpad acceleration: 0 = None, 1 = Flat, 2 = Adaptive (recommended for touchpad)
trackpad_accel_profile = 2
# Trackpad speed (range: -1.0 to 1.0, default: 0.0)
trackpad_accel_speed = 0.0

# Minimum swipe distance threshold for gestures
# swipe_min_threshold = 1

# Cursor behavior
cursor_hide_timeout = 5
warpcursor = 1
