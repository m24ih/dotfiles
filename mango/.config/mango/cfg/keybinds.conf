# | Keybinds |
# Configure your keybinds here. | https://mangowm.github.io/docs/bindings/keys

# Your favorite applications.
bind = SUPER, Return, spawn, ghostty
bind = SUPER, e, spawn, dolphin
bind = SUPER, b, spawn, vivaldi

# Please choose the text editor of your choice.
# bind = SUPER, x, spawn, zed

bind = SUPER, q, killclient,

# Noctalia specific keybinds.
bind = SUPER, space, spawn, noctalia msg panel-toggle launcher
bind = SUPER, period, spawn, noctalia msg panel-toggle launcher /e
bind = SUPER, s, spawn, noctalia msg panel-toggle control-center
bind = SUPER+CTRL, s, spawn, noctalia msg settings-toggle
bind = SUPER, w, spawn, noctalia msg panel-toggle noctalia/wallhaven:browser
bind = SUPER, v, spawn, noctalia msg panel-toggle clipboard
bind = SUPER, l, spawn, noctalia msg session lock
bind = SUPER, slash, spawn, noctalia msg panel-toggle blackbartblues/keymap:panel
bind = SUPER+SHIFT, p, spawn, noctalia msg panel-toggle session
bind = SUPER+SHIFT, q, spawn, noctalia msg panel-toggle session

# Special keys / Applications
bind = NONE, XF86Calculator, spawn, kcalc

# Screenshots
bind = NONE, Print, spawn, noctalia msg screenshot-region
bind = SUPER+SHIFT, s, spawn, noctalia msg screenshot-region
bind = SUPER, p, spawn, noctalia msg screenshot-region
bind = SUPER+ALT, p, spawn, noctalia msg screenshot-fullscreen all

# Reload config
bind = SUPER, r, reload_config

# Audio controls
bind = NONE, XF86AudioRaiseVolume, spawn, noctalia msg volume-up
bind = NONE, XF86AudioLowerVolume, spawn, noctalia msg volume-down
bind = NONE, XF86AudioMute, spawn, noctalia msg volume-mute

# Brightness controls
bind = NONE, XF86MonBrightnessUp, spawn, noctalia msg brightness-up
bind = NONE, XF86MonBrightnessDown, spawn, noctalia msg brightness-down

# Switch window focus
bind = SUPER, Tab, focusstack, next
bind = SUPER, Left, focusdir, left
bind = SUPER, Right, focusdir, right
bind = SUPER, Up, focusdir, up
bind = SUPER, Down, focusdir, down

# Swap window
bind = SUPER+SHIFT, Up, exchange_client, up
bind = SUPER+SHIFT, Down, exchange_client, down
bind = SUPER+SHIFT, Left, exchange_client, left
bind = SUPER+SHIFT, Right, exchange_client, right

# Switch window status
bind = SUPER, g, toggleglobal,
bind = ALT, Tab, toggleoverview,
bind = SUPER+SHIFT, Tab, togglejump,
bind = SUPER, c, togglefloating,
bind = SUPER, f, togglemaximizescreen,
bind = SUPER+SHIFT, f, togglefullscreen,
bind = SUPER+ALT, f, togglefakefullscreen,
bind = SUPER, i, minimized,
bind = SUPER, o, toggleoverlay,
bind = SUPER+SHIFT, I, restore_minimized
bind = SUPER, z, toggle_named_scratchpad, (?i)proton.*, (?i)proton.*, proton-pass

# Scroller layout
bind = SUPER+SHIFT, e, set_proportion, 1.0
bind = SUPER, x, switch_proportion_preset,

# Switch layout
bind = SUPER, n, switch_layout

# Switch between workspaces
bind = SUPER, 1, view, 1, 0
bind = SUPER, 2, view, 2, 0
bind = SUPER, 3, view, 3, 0
bind = SUPER, 4, view, 4, 0
bind = SUPER, 5, view, 5, 0
bind = SUPER, 6, view, 6, 0
bind = SUPER, 7, view, 7, 0
bind = SUPER, 8, view, 8, 0
bind = SUPER, 9, view, 9, 0

# Tag: move client to another workspace.
bind = SUPER+SHIFT, 1, tag, 1, 0
bind = SUPER+SHIFT, 2, tag, 2, 0
bind = SUPER+SHIFT, 3, tag, 3, 0
bind = SUPER+SHIFT, 4, tag, 4, 0
bind = SUPER+SHIFT, 5, tag, 5, 0
bind = SUPER+SHIFT, 6, tag, 6, 0
bind = SUPER+SHIFT, 7, tag, 7, 0
bind = SUPER+SHIFT, 8, tag, 8, 0
bind = SUPER+SHIFT, 9, tag, 9, 0

# Tagsilent: move client to another workspace silently (keep current focus).
bind = SUPER+CTRL, 1, tagsilent, 1, 0
bind = SUPER+CTRL, 2, tagsilent, 2, 0
bind = SUPER+CTRL, 3, tagsilent, 3, 0
bind = SUPER+CTRL, 4, tagsilent, 4, 0
bind = SUPER+CTRL, 5, tagsilent, 5, 0
bind = SUPER+CTRL, 6, tagsilent, 6, 0
bind = SUPER+CTRL, 7, tagsilent, 7, 0
bind = SUPER+CTRL, 8, tagsilent, 8, 0
bind = SUPER+CTRL, 9, tagsilent, 9, 0

# Switch between monitors
bind = SUPER+ALT, Left, focusmon, left
bind = SUPER+ALT, Right, focusmon, right
# Move window to another monitor
bind = SUPER+ALT+SHIFT, Left, tagmon, left
bind = SUPER+ALT+SHIFT, Right, tagmon, right

# Gaps
bind = SUPER+SHIFT, X, incgaps, 1
bind = SUPER+SHIFT, Z, incgaps, -1
bind = SUPER+SHIFT, R, togglegaps

# Movewin
bind = CTRL+SHIFT, Up, movewin, +0, -50
bind = CTRL+SHIFT, Down, movewin, +0, +50
bind = CTRL+SHIFT, Left, movewin, -50,+0
bind = CTRL+SHIFT, Right, movewin, +50,+0

# Resizewin
bind = CTRL+ALT, Up, resizewin, +0, -50
bind = CTRL+ALT, Down, resizewin, +0, +50
bind = CTRL+ALT, Left, resizewin, -50, +0
bind = CTRL+ALT, Right, resizewin, +50, +0

# Mouse Button Bindings.
# btn_left and btn_right can't bind none mod key
mousebind = SUPER, btn_left, moveresize,curmove
# mousebind = NONE, btn_middle, togglemaximizescreen, 0
mousebind = SUPER, btn_right, moveresize, curresize

# Scroll to switch workspaces
axisbind = SUPER, UP, viewtoleft
axisbind = SUPER, DOWN, viewtoright

# Touchpad Gestures | https://mangowm.github.io/docs/bindings/gestures
# Syntax: gesturebind=<MODIFIERS>,<DIRECTION>,<FINGERS>,<COMMAND>,<PARAMETERS>

# 3 Fingers: Window Focus Navigation
gesturebind = none, left, 3, focusdir, left
gesturebind = none, right, 3, focusdir, right
gesturebind = none, up, 3, focusdir, up
gesturebind = none, down, 3, focusdir, down

# 4 Fingers: Workspace & Overview Navigation
gesturebind = none, left, 4, viewtoleft
gesturebind = none, right, 4, viewtoright
gesturebind = none, up, 4, toggleoverview
gesturebind = none, down, 4, toggleoverview

# Modifier + Gesture shortcuts
gesturebind = SUPER, up, 3, togglefullscreen
gesturebind = SUPER, down, 3, togglefloating

# Quick toggle trackpad on/off
bind = SUPER+SHIFT, t, toggle_trackpad_enable
