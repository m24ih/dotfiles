# ==============================================================================
# HP Victus 16 - Özel TLP 1.10 Yapılandırması
# ==============================================================================
# Bu dosya /etc/tlp.d/01-victus.conf konumuna kurulur.
# Drop-in yapılandırma sayesinde /etc/tlp.conf dosyasını bozmadan özel ayarları uygular.

# --- TLP Genel Etkinleştirme ---
TLP_ENABLE=1

# --- Profil Eşleştirmeleri ---
# Prizde Dengeli (BAL), Bataryada Güç Tasarrufu (SAV)
TLP_PROFILE_AC=BAL
TLP_PROFILE_BAT=SAV
TLP_AUTO_SWITCH=2

# --- CPU Boost (Core Performance Boost) ---
# Sadece PRF (Performans) modunda açık, BAL ve SAV modlarında kapalı
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0
CPU_BOOST_ON_SAV=0

# --- AMD P-State EPP (Energy Performance Preference) ---
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_performance
CPU_ENERGY_PERF_POLICY_ON_SAV=power

# --- HP Victus ACPI Platform Profili (Fan ve Güç Limiti) ---
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=balanced
PLATFORM_PROFILE_ON_SAV=low-power

# --- Ağ Bağlantıları (Güç Tasarrufu Tamamen Kapalı) ---
# Wi-Fi güç tasarrufunu (802.11 power save) kapatır
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=off

# --- AMD Panel Güç Tasarrufu (ABM - Adaptive Backlight Management) ---
# Renk/kontrast ayarı sadece Güç Tasarrufu (SAV) modunda devreye girer
AMDGPU_ABM_LEVEL_ON_AC=0
AMDGPU_ABM_LEVEL_ON_BAT=0
AMDGPU_ABM_LEVEL_ON_SAV=3

# --- Nvidia Kartı Koruma ---
# Nvidia ve Nouveau sürücülerini TLP'nin PCIe Runtime PM müdahalesinden hariç tutar
RUNTIME_PM_DRIVER_DENYLIST="amdgpu mei_me nouveau nvidia xhci_hcd"
