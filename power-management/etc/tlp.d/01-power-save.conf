# ==============================================================================
# TLP Güç Yönetimi ve Batarya Tasarruf Yapılandırması
# ==============================================================================
# Bu dosya /etc/tlp.d/01-power-save.conf konumuna kurulur.
# Drop-in yapılandırma sayesinde /etc/tlp.conf dosyasını bozmadan özel ayarları uygular.
#
# Çakışma Notu:
# TLP, power-profiles-daemon (ppd) ve tuned servisleri ile aynı çekirdek arayüzlerini
# yönettiği için çakışır. Bu nedenle ppd ve tuned servisleri maskelenmelidir.

# 1. TLP Genel Etkinleştirme
TLP_ENABLE=1
TLP_DEFAULT_MODE=AC
TLP_PERSISTENT_DEFAULT=0

# 2. Batarya Güç Profili (Power Profile)
# Prizdeyken (AC) standart, bataryada agresif tasarruf (SAV).
TLP_PROFILE_BAT=SAV

# 3. CPU Performans ve Turbo Boost Yönetimi
# AC (Priz) modunda Turbo Boost açık (1), Batarya modunda kapalı (0).
# Bataryadayken ani frekans sıçramalarını ve gereksiz güç tüketimini önler.
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0
CPU_BOOST_ON_SAV=0

# 4. CPU Enerji / Performans Politikası (EPP / EPB)
# Intel HWP ve AMD P-State işlemciler için enerji-performans dengesi
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power

# 5. Platform Güç Profili (ACPI Platform Profile)
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=low-power
